teacher_model: claude-haiku-4-5-20251001
max_tokens: 512
max_rounds: 3
concurrency: 30
n_samples: 500

# Seed tasks — extend with Jade-specific task prompts before a full run
tasks:
  - "Read /workspace/main.jde and list its exported function names."
  - "Write 'hello world' to /workspace/out.txt."
  - "List all files under /workspace/src."
  - "Run 'ls -la /workspace' and return the output."
  - "Fetch https://api.example.com/status and return the status field."
  - "Read /workspace/config.json, set the version field to '2.0', write it back."
  - "Copy /workspace/a.txt to /workspace/b.txt."
  - "Store the value 42 under the key 'counter' in memory."
  - "Read the value stored at key 'counter' in memory."
  - "Delete /workspace/tmp.txt."
  - "POST {\"action\": \"ping\"} to https://api.example.com/rpc and return the response."
  - "Read /workspace/data.csv and return the number of rows."
  - "Write the string 'done' to /workspace/status.txt, then delete /workspace/tmp.txt."
  - "Check if /workspace/lock exists. If so, delete it."
  - "Run 'cat /workspace/log.txt' and return the last line."
