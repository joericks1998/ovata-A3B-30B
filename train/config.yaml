model_id: Qwen/Qwen3-30B-A3B-Instruct
output_dir: ./checkpoints/ovata-v0.1
data_path: data/processed/train.jsonl
chat_template: chat_template/template.jinja2
max_seq_length: 4096

# <|tool_call|> must be registered as a special token so it's never split
special_tokens:
  - "<|tool_call|>"

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  epochs: 3
  batch_size: 1
  grad_accum: 8        # effective batch = 8 * num_gpus
  lr: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.05
  save_steps: 100
  report_to: wandb     # set to "none" to skip W&B

deepspeed_config: train/ds_zero3.json
